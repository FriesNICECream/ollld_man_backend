services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ollld_man
      POSTGRES_USER: ollld_man
      POSTGRES_PASSWORD: ollld_man
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollld_man -d ollld_man"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
